// must never call save(), so the two windows cannot echo each other. Saved state older than TTL is ignored.
// Every storage access is wrapped: with storage blocked the windows simply run independently.
window.l5sync = function (name, opts) {
  var KEY = 'l5:' + location.pathname + ':' + name, TTL = 2 * 3600 * 1000, seq = Date.now();

  document.head.appendChild(allow);
  function apply(raw, initial) {
    try {
      var o = JSON.parse(raw);
      if (!o || typeof o.t !== 'number' || Date.now() - o.t > TTL) return;
      opts.set(o.s, !!initial);
    } catch (err) {}
  }

<h1 id="october-20-2025">October 20, 2025</h1>
<p>Just before midnight Pacific, a <strong>race condition in AWS's own DNS automation</strong> left the address of its database service, DynamoDB, <strong>empty</strong> in the Northern Virginia region (us-east-1).</p>
<p>The automation could not repair the problem, so <strong>AWS operators had to fix it by hand.</strong></p>
<p>Anything that needed DynamoDB could no longer find it, including other AWS services. Snapchat, Fortnite, and Duolingo went down.</p>
<p>The address was back by <strong>2:25 AM Pacific</strong>, but the incident lasted <strong>14.5 hours</strong>.</p>
<footer>Source: AWS post-event summary, aws.amazon.com/message/101925</footer>

<h1 id="august-9-2021">August 9, 2021</h1>
<p>Researchers found that a feature of Azure's managed database, Cosmos DB, could be used to get the keys to <strong>other customers' databases</strong>.</p>
<p>With a key, an attacker could <strong>view, modify, and delete</strong> the data in that account.</p>
<p>Microsoft disabled the feature within <strong>48 hours</strong> and told customers to regenerate their keys.</p>
<footer>Sources: Wiz Research (chaosdb.wiz.io); Microsoft Security Response Center</footer>

<h1 id="relationships-in-c4-diagrams">Relationships in C4 Diagrams</h1>
<div class="eq">
<svg viewBox="0 0 190 60" aria-hidden="true"><rect class="bx" x="4" y="8" width="48" height="44" rx="8" /><text class="bt" x="28" y="37" text-anchor="middle">A</text><rect class="bx" x="138" y="8" width="48" height="44" rx="8" /><text class="bt" x="162" y="37" text-anchor="middle">B</text><path class="ln" d="M 52 30 L 124 30" /><path class="hd" d="M 138 30 L 123 22 L 123 38 Z" /></svg>
<p>Arrow between elements = elements are related</p>
</div>
<p class="lead">Just like in other diagramming specs, relationships are represented with arrows. Once again, there is no strict prescription here, but there is a permissive set of rules.</p>
<div class="rules">
<div class="rule">
<svg viewBox="0 0 205 78" aria-hidden="true"><rect class="bx" x="4" y="16" width="48" height="46" rx="8" /><text class="bt" x="28" y="46" text-anchor="middle">A</text><rect class="bx" x="153" y="16" width="48" height="46" rx="8" /><text class="bt" x="177" y="46" text-anchor="middle">B</text><path class="ln ls" d="M 52 39 L 137 39" /><path class="hd" d="M 153 39 L 137 31 L 137 47 Z" /></svg>
<p><b>All arrows are unidirectional.</b> Whatever the relationship they are describing, each arrow should only describe one side of it.</p>
</div>
<div class="rule">
<svg viewBox="0 0 205 78" aria-hidden="true"><rect class="bx" x="4" y="16" width="48" height="46" rx="8" /><text class="bt" x="28" y="46" text-anchor="middle">A</text><rect class="bx" x="153" y="16" width="48" height="46" rx="8" /><text class="bt" x="177" y="46" text-anchor="middle">B</text><path class="ln ls" d="M 52 44 L 137 44" /><path class="hd" d="M 153 44 L 137 36 L 137 52 Z" /><text class="lb" x="102" y="33" text-anchor="middle">Uses</text></svg>
<p><b>Every arrow should be labeled.</b></p>
</div>
<div class="rule">
<svg viewBox="0 0 205 78" aria-hidden="true"><rect class="bx" x="4" y="16" width="48" height="46" rx="8" /><text class="bt" x="28" y="46" text-anchor="middle">A</text><rect class="bx" x="153" y="16" width="48" height="46" rx="8" /><text class="bt" x="177" y="46" text-anchor="middle">B</text><path class="ln ls" d="M 52 40 L 137 40" /><path class="hd" d="M 153 40 L 137 32 L 137 48 Z" /><text class="lb" x="102" y="30" text-anchor="middle">Uses</text><text class="pr" x="102" y="62" text-anchor="middle">[HTTPS]</text></svg>
<p>If the arrow is defining a communication relationship between two elements, the label should specify which <b>communication protocol</b> is being used (for example HTTPS).</p>
</div>

<p>A container is a deployable unit of code.</p>
<p>Some web applications have both an API layer and serve some frontend code, so should we have 1 container for the entire application? Or should we have two containers, one for the API layer and one for the frontend code?</p>

  // scale each inlined diagram (fixed size in canvas pixels) to fit its slot
