<h1 id="large-language-models">Large Language Models</h1>
<dl><dd>A <dfn>large language model (LLM)</dfn> is a set of files that store a neural network's trained weights. Weights are the billions of numbers that training adjusts, and inference multiplies inputs by them to compute the output. Inference requires separate software that loads these files.</dd></dl>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">config.json
tokenizer.json
model.safetensors
</code></pre>

<h1 id="quantization">Quantization</h1>
<dl><dd><dfn>Quantization</dfn> stores each weight in fewer bits, so the model uses less memory and serves more requests at some cost in accuracy.</dd></dl>
<p>Throughput and scores from a Qwen3 32B benchmark</p>
<table>
<thead>
<tr>
<th>Precision</th>
<th>Weights per 1B parameters</th>
<th>Throughput</th>
<th>MMLU Pro</th>
<th>HumanEval</th>
</tr>
</thead>
<tbody>
<tr>
<td>16 bit</td>
<td>2 GB</td>
<td>1.0x</td>
<td>70.2%</td>
<td>39.0%</td>
</tr>
<tr>
<td>8 bit</td>
<td>1 GB</td>
<td>1.5x</td>
<td>69.6%</td>
<td>39.0%</td>
</tr>
<tr>
<td>4 bit</td>
<td>0.5 GB</td>
<td>2.7x</td>
<td>68.7%</td>
<td>31.1%</td>
</tr>
</tbody>
</table>
<p>Full precision is technically 32 bits, but 16 bits loses almost no accuracy, so people loosely call 16 bits full precision.</p>

// marp-kit runtime core. Finds every element with data-widget="name" and mounts the widget registered under that name.
// Every dependency on Marp CLI's bespoke template (class names, presenter view markup) lives in this file, so a Marp
// upgrade that renames them is fixed here once.
(function () {
  if (window.MarpKit) return;

  var MARP = {
    slide: '.bespoke-marp-slide',                 // each slide's <svg>
    note: '.bespoke-marp-note',                   // each slide's speaker note in the presenter view, with data-index
    active: 'bespoke-marp-active',                // class on the slide being shown
    presenterPane: 'body[data-bespoke-view=presenter] .bespoke-marp-presenter-container svg.bespoke-marp-slide.bespoke-marp-active'
  };
  var TTL = 2 * 3600 * 1000;   // synced state older than this is ignored (yesterday's lecture should not come back)
  var registry = {}, counts = {};

  // Marp turns clicks off on the slide pane of its presenter view. Switch them back on for slides that hold a widget.
  var allow = document.createElement('style');
  allow.textContent = MARP.presenterPane + ':has([data-widget]) { pointer-events: auto; user-select: auto; }' + oscCss() + noteCss();
  document.head.appendChild(allow);

  // Marp's page controls: a vertical bar against the middle of the left edge, so they never cover the bottom of a slide.
  // Solid, because Marp's translucent black turns muddy where it crosses a slide's edge and the black margin beside it.
  function oscCss() {
    var osc = ':is(body[data-bespoke-view=""],body[data-bespoke-view=next]) .bespoke-marp-parent>.bespoke-marp-osc';
    var btn = osc + '>button[data-bespoke-marp-osc]';
    return osc + '{ left: 0; right: auto; top: 50%; bottom: auto; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; box-sizing: border-box; width: 46px; padding: 8px 6px; background: #1f3b73; border-radius: 0 10px 10px 0; box-shadow: 0 2px 12px rgba(31, 59, 115, .28); transition: opacity .2s ease; }' +
      osc + '>:where(*){ margin-left: 0; margin-top: 2px; }' +
      osc + '>:where(*):where(:first-child){ margin-top: 0; }' +
      btn + '{ width: 34px; height: 34px; flex: none; background-size: 18px; background-position: center; border: 0; border-radius: 8px; opacity: 1; transition: background-color .12s ease; }' +
      btn + ':hover:not(:disabled){ background-color: rgba(255, 255, 255, .18); }' +
      btn + ':hover:active:not(:disabled){ background-color: rgba(255, 255, 255, .3); }' +
      btn + ':disabled{ opacity: .35; }' +
      btn + ':focus-visible{ outline: 2px solid #fff; outline-offset: -2px; }' +
      // the tools sit apart from the slide navigation, under a thin rule
      osc + '>button[data-bespoke-marp-osc=fullscreen]{ margin-top: 15px; box-shadow: 0 -8px 0 -7px rgba(255, 255, 255, .35); }' +
      // the page number: Marp writes "Page 11 of 27", which stays as the real text and shows as a large 11 over a small "of 27"
      osc + '>span[data-bespoke-marp-osc=page]{ min-width: 0; width: 34px; margin-top: 4px; margin-bottom: 4px; opacity: 1; font-size: 0; line-height: 1; white-space: nowrap; }' +
      osc + '>span[data-bespoke-marp-osc=page]::before{ content: attr(data-mk-page); display: block; font-size: 17px; font-weight: 700; line-height: 1.15; }' +
      osc + '>span[data-bespoke-marp-osc=page]::after{ content: "of " attr(data-mk-total); display: block; font-size: 11px; line-height: 1.2; opacity: .8; }';
  }

  // the speaker note line a widget has picked out, bright against the presenter view's dark panel
  function noteCss() {
    return '.mk-note-line { display: block; padding: 2px 6px; margin: 0 -6px; border-radius: 4px; }' +
      '.mk-note-line.mk-note-on { background: #ffe27a; color: #111; font-weight: 700; }';
  }

  // copies Marp's page text into attributes that the CSS above can show, and keeps them current
  function watchPageNumber() {
    var span = document.querySelector('.bespoke-marp-parent > .bespoke-marp-osc [data-bespoke-marp-osc=page]');
    if (!span || span.hasAttribute('data-mk-watched')) return;
    span.setAttribute('data-mk-watched', '');
    function copy() {
      var m = span.textContent.match(/(\d+)\D+(\d+)/);
      if (!m) return;
      span.setAttribute('data-mk-page', m[1]);
      span.setAttribute('data-mk-total', m[2]);

    copy();
  }

  function parseConfig(root) {
    var raw = root.getAttribute('data-config');
    if (!raw) return {};
    try { return JSON.parse(raw); } catch (err) { console.error('marp-kit: bad data-config on', root, err); return {}; }
  }

  function context(root, name, index) {

      },

      // Escape normally opens Marp's slide overview. fn runs (capture phase, before Marp) while this slide is showing;
      // return true from fn to take the key, false to let Marp have it
      onEscape: function (fn) {

          if (e.key === 'Escape' && ctx.slideActive() && fn()) { e.preventDefault(); e.stopPropagation(); }
        }, true);
      },

      // Highlights the line of this slide's speaker note that contains marker, and scrolls it into view. Notes only exist in
      // the presenter view, so elsewhere this does nothing. Returns false until the note is there, so the caller can retry.
      markNote: function (marker) {
        if (document.body.getAttribute('data-bespoke-view') !== 'presenter') return false;
        var i = Array.prototype.indexOf.call(document.querySelectorAll(MARP.slide), root.closest(MARP.slide));
        var note = document.querySelector(MARP.note + '[data-index="' + i + '"]');

          note.setAttribute('data-mk-lines', '');
          note.querySelectorAll('p').forEach(function (p) {
            var lines = p.textContent.split('\n');
            p.textContent = '';
            lines.forEach(function (line) {
              var span = document.createElement('span');
              span.className = 'mk-note-line';
              span.textContent = line;
              p.appendChild(span);
            });
          });
        }
        note.querySelectorAll('.mk-note-line').forEach(function (line) {

        });
        return true;
      },

      // slide number. opts.get() returns the state, opts.set(state, initial) applies it; initial is true for state found at
      // load. Returns save(), to call after every local change. The storage event only fires in the OTHER window, and set()
      // must never call save(), so the two windows cannot echo each other. With storage blocked the windows run independently.

    var name = root.getAttribute('data-widget');

    root.setAttribute('data-mk-ready', '');

      registry[name](context(root, name, index));
      // widgets show their static fallback (print, PDF, no scripts) until this class is set
      root.classList.add('mk-ready');
    } catch (err) {
      console.error('marp-kit: widget "' + name + '" failed to mount', err);
    }
  }

  window.MarpKit = {
    marp: MARP,
    // register a widget: fn(ctx) builds it inside ctx.root
    widget: function (name, fn) { registry[name] = fn; },
    mount: function () { watchPageNumber(); document.querySelectorAll('[data-widget]').forEach(mountOne); }
  };
})();

// flow: animated diagrams that play by themselves. Each scene draws boxes, then moves labelled chips between them on
// a timeline, with a caption saying what is happening. It plays once while its slide is on screen and holds its last
// frame, restarts when the slide is entered, and holds one finished frame in print or with reduced motion. A timeline
// control (play button and draggable track) fades in after the first run and stays in step between presenter and
// audience windows. Optional pause points wait for the presenter's next key, and light up the matching "[Pause N]" or
// "[End]" bullet in the speaker notes.
//
// Scenes belong to the deck. A deck-local widgets/flow.scenes.js registers them, and can add colours:
//   MarpKit.flow.colors.teal = ['#00796b', '#e0f2f1'];          // [stroke, fill]
//   MarpKit.flow.scene('pipeline', function (d) { d.size(800, 300); d.end(6); d.box({...}); d.chip({...}); d.cap(0, '...'); });
// Markup: <div data-widget="flow" data-config='{"scene":"pipeline"}'></div>
MarpKit.flow = {
  scenes: {},
  colors: {
    prompt: ['#2b5fb3', '#e6eefb'], kv: ['#a85c10', '#fdf0e1'], out: ['#2d6a18', '#e6f3e0'], rej: ['#b22222', '#fbe6e6'],
    box: ['#3c4043', '#ffffff'], ctl: ['#6a33a8', '#f2eafa'], user: ['#2d6a18', '#ffffff'], idle: ['#c8ccd2', '#f4f5f7']
  },
  scene: function (name, fn) { MarpKit.flow.scenes[name] = fn; }
};

MarpKit.widget('flow', function (ctx) {

    still: function (t) { still = t; },

        g.style.opacity = t >= first && t < until ? 1 : 0;
      } });
    }
  };


  var scene = MarpKit.flow.scenes[ctx.config.scene];
  if (!scene) throw new Error('flow: no scene "' + ctx.config.scene + '". Register it with MarpKit.flow.scene in a deck-local widgets/flow.scenes.js');

  var frozen = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var printing = window.matchMedia('print');
  var finalFrame = still === null ? end : still;

  // the timeline control: fades in when the first run ends, so nothing competes with the first play
  var ctl = document.createElement('div');
  ctl.className = 'ctl';
  ctl.innerHTML = '<button class="pp" type="button"></button><div class="track" role="slider" tabindex="0" aria-label="Animation timeline" aria-valuemin="0"><div class="fill"></div></div>';
  root.appendChild(ctl);
  var pp = ctl.querySelector('.pp'), track = ctl.querySelector('.track'), fill = ctl.querySelector('.fill');

  caps.forEach(function (c) {
    if (c[0] <= 0) return;

    track.appendChild(mark);
  });

  // with pause points, the presenter's notes light up the bullet for the stretch being played: [Pause 1] up to and at the
  // first pause, and [End] after the last
  var noteMarker = null;
  function markNote(t) {
    if (!stops.length) return;
    var passed = stops.filter(function (s) { return s < t; }).length;
    var marker = passed < stops.length ? '[Pause ' + (passed + 1) + ']' : '[End]';
    if (marker !== noteMarker && ctx.markNote(marker)) noteMarker = marker;
  }

  function render(t) {
    items.forEach(function (i) { i.draw(t); });
    markNote(t);
    var text = '';
    caps.forEach(function (c) { if (t >= c[0]) text = c[1]; });
    if (cap.textContent !== text) cap.textContent = text;
    root.dataset.t = t.toFixed(2);
    fill.style.width = (Math.min(t / end, 1) * 100).toFixed(2) + '%';

  function stopAt(t, wait) {
    held = t;
    paused = true;
    waiting = wait;
    lastT = t;
    showControl(true);
    showPaused();
    render(t);

  // at a stop, the presenter's next key continues the animation instead of changing slide
  var NEXT = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1 };

  // the k key pauses and resumes the animation on the current slide. Marp keeps Space and the arrows for changing slides
  document.addEventListener('keydown', function (e) {

  }, true);

  function tick(now) {
    if (printing.matches) {
      render(finalFrame);
      wasActive = false;
    } else if (ctx.slideActive()) {

        start = now; paused = frozen; held = finalFrame; lastT = 0; waiting = false;

        render(held);
      } else {
        var elapsed = (now - start) / 1000;

        } else if (elapsed >= end) {
          stopAt(end, false);
        } else {
          lastT = Math.max(lastT, elapsed);   // a frame stamped just before a resume must not put a passed stop ahead again
          render(elapsed);
        }
      }
    } else {
      wasActive = false;
    }
    requestAnimationFrame(tick);
  }
  showPaused();
  render(0);
  requestAnimationFrame(tick);
});

      chat('User J', [[13.8, B, 76], [14.4, B, GPU]], 21);
      chat('User K', [[14, B + S, 76], [14.6, B + S, GPU]], 21);

      d.chip({ text: 'Prompt', at: [[18, A + 110, 22], [18.8, A + S, GPU]], until: 21.2 });
      d.chip({ tag: 'session-load', text: 'Session', solid: true, color: 'kv', w: 88, h: 34, size: 18, at: [[18.8, B, SSD], [20.2, A, GPU], [21.6, A, GPU], [22.2, 360, GAP], [23.2, 780, GAP], [24, C, CPU], [27.4, C, CPU], [28.2, C, GPU]], until: 30.6 });
      chat('New', [[21.2, A + S, GPU], [22.4, A + S, GPU], [23.4, A + S, CPU]]);
      d.chip({ tag: 'session-saved', text: 'Session', solid: true, color: 'kv', w: 88, h: 34, size: 18, at: [[22.4, A, GPU], [23.4, A, CPU]] });
      d.chip({ text: 'Reply', color: 'out', w: 72, at: [[28.6, C + 112, 62], [30, C + 112, 22]], until: 30.2 });

      d.cap(0, 'Kimi has no separate storage fleet, and the cache pool uses spare CPU memory and SSD across its GPU machines.');
      d.cap(3.8, 'Each prefill machine manages its local prefix blocks, and peer nodes fetch them over the network.');
      d.cap(7, 'Blocks of an active coding session remain in CPU memory between requests.');
      d.cap(10.6, 'The blocks of a stale session offload to SSD.');
      d.cap(14.4, 'For the next request, the scheduler estimates the time to first token of each option.');
      d.cap(18, 'The other prefill node has the lowest estimate and fetches the blocks.');
      d.cap(21.2, 'It computes only the new message and streams the KV cache to the decode node during that computation.');
      d.cap(23.4, 'Local CPU memory on the prefill node stores the session\'s blocks.');
      d.cap(25.4, 'The KV cache waits in the decode node\'s CPU memory while GPU memory serves the running batch.');
      d.cap(28.2, 'At the next batch, the KV cache loads into GPU memory and decode generates the reply.');
      d.cap(30.4, 'The blocks remain on the prefill machines after decode.');
      d.cap(32.2, 'Popular blocks such as shared system prompts replicate to more prefill nodes.');
      d.cap(35.2, 'Eviction removes an abandoned session, so a later request recomputes those blocks.');
      d.cap(38, 'GPU memory holds the KV cache of running requests. CPU memory and SSD store blocks for reuse.');
    },

    scheduler: function (d) {
      // the prompt becomes a chain of keys, then each node's keys are compared in order, stopping at the first miss
      d.size(1140, 420); d.end(16.5); d.still(15.5);
      var BLOCKS = ['Why', 'is', 'my', 'code'], KEYS = ['#a1', '#b7', '#c3', '#d9'];
      var COLS = [60, 140, 220, 300], KEY_Y = 255, SLOT = function (i) { return 540 + i * 70; };
      var rows = [20, 150, 280];
      var nodes = [
        { cached: ['#a1', '#f2', '#k8'], hits: 1, from: 4.2, count: '1 block' },
        { cached: ['#a1', '#b7', '#c3'], hits: 3, from: 6, count: '3 blocks' },
        { cached: ['#p4', '#q6'], hits: 0, from: 8.6, count: '0 blocks' }
      ];
      var key = function (text, at, extra) {
        var o = { text: text, color: 'ctl', w: 58, h: 34, size: 19, at: at };
        for (var k in extra) o[k] = extra[k];
        d.chip(o);
      };

      d.box({ x: 16, y: 130, w: 328, h: 170, label: 'Conductor', sub: 'Scheduler', ty: 165, color: 'ctl', glow: [[1.4, 4.2], [12.6, 13.4]], hot: '#e4d4f7', size: 26 });
      d.text({ x: 180, y: 38, text: 'Prompt blocks', size: 22, show: [0.3, 4.2] });
      d.text({ x: 595, y: 16, text: 'Keys cached on each prefill node', size: 20 });
      d.text({ x: 985, y: 16, text: 'Load on each decode node', size: 20 });
      d.line({ x1: 344, y1: 200, x2: 390, y2: 84, plain: true });
      d.line({ x1: 344, y1: 215, x2: 390, y2: 214, plain: true });
      d.line({ x1: 344, y1: 230, x2: 390, y2: 344, plain: true });

      BLOCKS.forEach(function (b, i) {
        var t = 1.4 + i * 0.6;
        d.chip({ text: b, w: 66, size: 19, at: [[0.3, COLS[i] - 30, 80], [1, COLS[i], 80], [t, COLS[i], 80], [t + 0.5, COLS[i], KEY_Y]], until: t + 0.5 });
        key(KEYS[i], [[t + 0.5, COLS[i], KEY_Y]], { tag: 'key' });
        // each key is built on the one before it
        if (i) d.line({ x1: COLS[i - 1] + 29, y1: KEY_Y, x2: COLS[i] - 29, y2: KEY_Y, show: [t + 0.5] });
      });

      nodes.forEach(function (node, r) {
        var y = rows[r], TOP = y + 42, BOTTOM = y + 86, arrive = node.from + 0.7;
        var step = function (i) { return arrive + 0.3 + i * 0.4; };
        d.box({ x: 390, y: y + 12, w: 410, h: 104, label: 'Prefill ' + (r + 1), lx: 445, ty: y + 46, size: 22, glow: r === 1 ? [[10.4, 12.6]] : [] });
        d.text({ x: 445, y: y + 82, text: node.count, size: 22, weight: 700, color: '#1f3b73', show: [step(node.hits) + 0.1] });
        node.cached.forEach(function (c, i) {
          d.chip({ text: c, color: 'kv', w: 58, h: 34, size: 19, at: [[0, SLOT(i), BOTTOM]] });
          if (i < node.hits) d.chip({ tag: 'hit' + r, text: c, color: 'kv', solid: true, w: 58, h: 34, size: 19, at: [[step(i), SLOT(i), BOTTOM]] });
        });
        KEYS.forEach(function (k, i) { key(k, [[node.from, COLS[i], KEY_Y], [arrive, SLOT(i), TOP]]); });
        d.chip({ tag: 'miss' + r, text: KEYS[node.hits], color: 'rej', w: 58, h: 34, size: 19, at: [[step(node.hits), SLOT(node.hits), TOP]] });
      });

      // the decode pool has its own size and its rows line up with nothing, so no prefill node looks tied to a decode node
      [[92, 0.85], [232, 0.3]].forEach(function (n, i) {
        d.box({ x: 850, y: n[0], w: 270, h: 104, label: 'Decode ' + (i + 1), ty: n[0] + 30, size: 22, glow: i === 1 ? [[14.2, 16.5]] : [] });
        d.bar({ x: 875, y: n[0] + 56, w: 220, h: 28, color: 'out', from: -1, to: 0, fill: n[1] });
      });

      d.chip({ text: 'Prompt', at: [[10.4, 344, 215], [11.4, 445, 214]], until: 11.6 });
      d.chip({ text: '', color: 'kv', w: 40, h: 30, at: [[13.2, 800, 214], [14.2, 860, 284]], until: 14.3 });
      d.cap(0, 'Moonshot\'s Conductor scheduler receives the request.');
      d.cap(1.4, 'Each block\'s key is a hash of that block and all preceding blocks.');
      d.cap(4.2, 'Conductor compares those keys in order against the keys cached on each prefill node.');
      d.cap(5.6, 'Matching stops at the first missing key.');
      d.cap(10.4, 'Prefill 2 receives the request because it has the longest prefix match and spare capacity.');
      d.cap(12.6, 'Conductor then selects a decode node by load from the separately sized decode pool.');
    },

    reject: function (d) {
      d.size(1140, 420); d.end(15); d.still(13.5);
      d.text({ x: 110, y: 22, text: 'Late rejection', size: 24, weight: 700 });
      d.box({ x: 400, y: 50, w: 240, h: 110, label: 'Prefill', glow: [[1.5, 3.8]], hot: '#fbe6e6' });
      d.box({ x: 770, y: 50, w: 240, h: 110, label: 'Decode', sub: 'full', color: 'rej' });
      d.line({ x1: 170, y1: 105, x2: 398, y2: 105 });
      d.line({ x1: 640, y1: 105, x2: 768, y2: 105 });
      d.chip({ text: 'Request', at: [[0.3, 170, 105], [1.5, 350, 105]], until: 1.6 });
      d.chip({ text: 'GPU time wasted', color: 'rej', at: [[3.8, 640, 105], [4.8, 770, 105], [5.4, 770, 200]] });
      d.text({ x: 110, y: 240, text: 'Early rejection', size: 24, weight: 700 });
      d.box({ x: 400, y: 270, w: 240, h: 110, label: 'Prefill', sub: 'available', glow: [] });
      d.box({ x: 770, y: 270, w: 240, h: 110, label: 'Decode', sub: 'full', color: 'rej' });
      d.box({ x: 110, y: 270, w: 200, h: 110, label: 'Scheduler', sub: 'decode is full', color: 'ctl', size: 25, subSize: 19, glow: [[7.4, 9]], hot: '#e4d4f7' });
      d.line({ x1: 310, y1: 325, x2: 398, y2: 325 });
      d.chip({ text: 'Request', at: [[6.5, 30, 325], [7.4, 75, 325]], until: 7.6 });
      d.chip({ text: 'Rejected', color: 'rej', at: [[8, 210, 340], [9, 210, 400]] });
      d.cap(0, 'A request enters prefill while the decode pool is at capacity.');
      d.cap(3.8, 'Rejection after prefill wastes the GPU time already spent.');
      d.cap(6.5, 'Early rejection checks decode load before prefill starts.');
      d.cap(9.5, 'Moonshot found that early rejection made prefill and decode load oscillate.');
      d.cap(11.5, 'Decode load prediction reduced the oscillation.');
    },

    full: function (d) {
      d.size(1140, 430); d.end(17); d.still(15);
      d.box({ x: 10, y: 170, w: 130, h: 100, label: 'User', color: 'user', size: 25 });
      d.box({ x: 200, y: 165, w: 190, h: 110, label: 'Conductor', sub: 'Scheduler', color: 'ctl', glow: [[1.4, 2.6]], hot: '#e4d4f7', size: 25 });
      d.box({ x: 200, y: 10, w: 190, h: 90, label: 'Early rejection', color: 'rej', size: 22, glow: [[14, 15.5]], hot: '#fbe6e6' });
      d.box({ x: 440, y: 0, w: 695, h: 425, dash: true, color: 'box', label: "Kimi's serving cluster", size: 21, lx: 1000, ty: 406 });
      d.box({ x: 470, y: 20, w: 260, h: 100, label: 'Prefill pool', size: 26, glow: [[4.6, 7]] });
      d.box({ x: 470, y: 165, w: 260, h: 110, label: 'KV cache pool', size: 25, color: 'kv', db: true });
      d.box({ x: 470, y: 320, w: 260, h: 95, label: 'Decode pool', size: 26, glow: [[8.4, 13.6]] });
      d.box({ x: 810, y: 40, w: 300, h: 90, label: 'GPU memory', size: 24, color: 'kv' });
      d.box({ x: 810, y: 165, w: 300, h: 90, label: 'CPU memory', size: 24, color: 'kv' });
      d.box({ x: 810, y: 290, w: 300, h: 90, label: 'SSD', size: 24, color: 'kv' });
      d.line({ x1: 730, y1: 220, x2: 808, y2: 210, both: true });
      d.line({ x1: 960, y1: 130, x2: 960, y2: 163, both: true });
      d.line({ x1: 960, y1: 255, x2: 960, y2: 288, both: true });
      d.line({ x1: 140, y1: 205, x2: 198, y2: 205 });
      d.line({ x1: 295, y1: 165, x2: 295, y2: 102 });
      d.line({ x1: 390, y1: 195, x2: 468, y2: 90 });
      d.line({ x1: 390, y1: 245, x2: 468, y2: 345 });
      d.line({ x1: 600, y1: 120, x2: 600, y2: 163, both: true });
      d.line({ x1: 600, y1: 275, x2: 600, y2: 318 });
      d.line({ x1: 468, y1: 395, x2: 90, y2: 272 });
      d.chip({ text: 'Prompt', w: 90, at: [[0.3, 75, 148], [1.4, 170, 148]], until: 1.5 });
      d.chip({ text: 'Prompt', w: 90, at: [[2.6, 390, 195], [3.6, 470, 90]], until: 3.7 });
      [0, 1, 2].forEach(function (i) { d.chip({ text: '', color: 'kv', w: 40, h: 30, at: [[3.6 + i * 0.2, 600, 165], [4.5 + i * 0.2, 600, 120]], until: 4.6 + i * 0.2 }); });
      [0, 1, 2].forEach(function (i) { d.chip({ text: '', color: 'kv', w: 40, h: 30, at: [[6.4 + i * 0.3, 600, 120], [7 + i * 0.3, 600, 220], [8.2 + i * 0.3, 600, 320]], until: 8.3 + i * 0.3 }); });
      [0, 1, 2, 3].forEach(function (i) { var t = 8.8 + i * 1.2; d.chip({ text: 'Token', w: 84, color: 'out', at: [[t, 468, 395], [t + 1.2, 140, 290]], until: t + 1.25 }); });
      d.chip({ text: 'Overload', w: 110, color: 'rej', at: [[14, 295, 165], [15, 295, 132]] });
      d.cap(0, 'Conductor assigns each prompt a prefill node and a decode node.');
      d.cap(3.6, 'Reusable KV cache transfers to the prefill node.');
      d.cap(4.6, 'Prefill computes only the uncached tokens.');
      d.cap(6.4, 'The KV cache streams to the decode node.');
      d.cap(8.4, 'Decode generates one token per step.');
      d.cap(14, 'When the decode pool lacks capacity, Conductor rejects the request early.');
    }
  };

  for (var name in SCENES) MarpKit.flow.scene(name, SCENES[name]);
})();

MarpKit.mount();
</script></body></html>
