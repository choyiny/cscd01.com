div#\:\$p > svg > foreignObject > section [data-bespoke-marp-fragment=inactive] { opacity: 0; visibility: visible !important; transition: none; }

div#\:\$p > svg > foreignObject > section .pgd-wrap.fill { position: absolute; inset: 0; }
div#\:\$p > svg > foreignObject > section .pgd-wrap.img { position: relative; width: 100%; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] { display: grid; grid-template-columns: auto 1fr; column-gap: 30px; align-items: center; width: 100%; margin-top: 6px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .grid { display: grid; grid-template-columns: 44px 124px repeat(3, 190px); grid-template-rows: 32px 34px repeat(3, 132px); gap: 8px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .axis { font-size: 23px; font-weight: 700; color: #111; display: flex; align-items: center; justify-content: center; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .axis.like { grid-column: 3 / 6; grid-row: 1; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .axis.imp { grid-column: 1; grid-row: 3 / 6; writing-mode: vertical-rl; transform: rotate(180deg); }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .col { grid-row: 2; font-size: 21px; color: #444; display: flex; align-items: center; justify-content: center; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .grid > .row { grid-column: 2; font-size: 21px; color: #444; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell { position: relative; box-sizing: border-box; border: 3px solid transparent; border-radius: 10px; padding: 34px 6px 6px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.low { background: #dff0d6; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.medium { background: #fdf0b8; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.high { background: #f8d7d7; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell .num { position: absolute; left: 9px; top: 3px; font-size: 21px; font-weight: 700; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.low .num { color: #2d6a18; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.medium .num { color: #7a5a00; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell.high .num { color: #b22222; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .cell:focus-visible { outline: 3px solid #1f3b73; outline-offset: 2px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board].picking .cell { cursor: pointer; border-color: #8a93a3; border-style: dashed; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board].picking .cell:hover { border-color: #1f3b73; border-style: solid; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .chips { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .chip { font: 700 16px 'Poppins', 'Helvetica Neue', Arial, sans-serif; line-height: 1.2; white-space: nowrap; color: #1f3b73; background: #fff; border: 2.5px solid #1f3b73; border-radius: 8px; padding: 3px 8px; cursor: pointer; text-align: left; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .chip:hover { background: #eef3fb; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .chip.selected { background: #1f3b73; color: #fff; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .chip:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .side { display: flex; flex-direction: column; gap: 14px; align-self: stretch; justify-content: center; min-width: 0; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register { display: grid; row-gap: 6px; font-size: 18px; line-height: 1.25; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register .row { display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 10px; padding-bottom: 6px; border-bottom: 1px solid #d6dae1; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register .head { font-weight: 700; color: #555; font-size: 17px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register .risk { color: #222; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register .fix { color: #2d6a18; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .register .adds { color: #b22222; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .tray { border: 3px dashed #9aa1ab; border-radius: 12px; padding: 10px 12px 12px; min-height: 64px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .tray-label { font-size: 18px; color: #555; margin-bottom: 8px; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board].picking .tray { cursor: pointer; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .clear { align-self: flex-start; font: 700 17px 'Poppins', 'Helvetica Neue', Arial, sans-serif; color: #555; background: #fff; border: 2px solid #9aa1ab; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .clear:hover { background: #f1f3f6; }
div#\:\$p > svg > foreignObject > section [data-widget=risk-board] .hint { font-size: 18px; color: #555; }

<h1 id="the-hardest-part-of-the-job">The hardest part of the job</h1>
<p>Code is easy write, and technical problems can be constrained, analyzed and solutioned for.</p>
<p>But, we do not build in isolation. You can be an expert in all the things we’ve discussed in lecture up until this point and still be ineffective in the real world.</p>
<p><strong>The ability to communicate architecture to others, both technical and non-technical, is the most challenging aspect of the software architect role.</strong></p>
</section>

<h1 id="architecture-is-about-decisions">Architecture is about decisions</h1>
<p>The role of an architect is to make <strong>architectural decisions</strong>, these are decisions that are considered to be <strong>architecturally significant.</strong></p>
<p>Question: Are technology choices <strong>architectural decisions?</strong></p>
<p>Answer: It depends… (Let’s find out in this lecture)</p>

<h1 id="what-does-it-mean-to-be-a-good-decision-maker">What does it mean to be a good decision maker?</h1>
<p>Afraid to make the wrong decision? Some architects avoid this by not making any decision. <strong>Talk is not making a decision.</strong></p>
<p>Make decisions from a position of knowledge. <strong>Acquire knowledge by making communication a priority for your team.</strong></p>
<p>An architect should be a bridge between the the technical and non-technical members of the team.</p>

<ul>

<h1 id="july-8-2022">July 8, 2022</h1>
<p>On a Friday morning, Rogers wireless and home internet service <strong>stops across Canada</strong>.</p>
<p>Interac runs on the Rogers network, so debit payments stop working in stores. For a large share of Rogers customers, a call to <strong>911 does not connect</strong>.</p>
<p>By the time service returns more than a day later, the outage has cut off over <strong>12 million customers</strong>.</p>

<h1 id="rogers-network-upgrade">Rogers Network Upgrade</h1>
<p>For several weeks, Rogers engineers have been upgrading the core of the network, which carries all wireless and home internet traffic.</p>
<p>The upgrade is a series of configuration changes to the routers, made in <strong>seven phases</strong>. Each change receives a <strong>risk rating</strong>, which decides how much review and lab testing it must pass.</p>
<p>With five phases finished without a problem, the team begins <strong>phase six</strong> on the morning of July 8.</p>

<h1 id="2017">2017</h1>
<p>To get past the limits of one database, Discord moves its messages to <strong>Cassandra</strong>.</p>
<p>By 2017 the database runs on 12 servers, with every message stored on 3 of them.</p>
<p>The team picks Cassandra knowing that it trades <strong>strong consistency for availability</strong>.</p>

<h1 id="replication">Replication</h1>
<p class="risk"><b>Risk</b> Losing a node loses the data stored on it.</p>
<dl><dd><dfn>Replication</dfn> stores each record on several nodes, so the data survives the loss of one node. Each stored copy is a <dfn>replica</dfn>. A <dfn>replication factor</dfn> of 3 gives Discord three replicas of every message.</dd></dl>
<p>Cassandra has no primary node, so any replica accepts a write.</p>
</section>

<h1 id="quorum">Quorum</h1>
<p class="risk"><b>Risk</b> A read reaches a replica that missed the latest write.</p>
<dl><dd>A read or write reaches <dfn>quorum</dfn> once a set number of replicas confirm it. With N replicas, W confirmations per write and R per read, every read includes the latest write when R + W &gt; N.</dd></dl>
<div data-widget="flow" data-config='{"scene":"quorum"}'></div>
</section>

<h1 id="consistent-hashing">Consistent Hashing</h1>
<p class="risk"><b>Risk</b> A change in node count moves most keys.</p>
<dl><dd><dfn>Consistent hashing</dfn> places nodes and partition keys on a ring, where each key belongs to the next node clockwise. A new node therefore takes keys from one neighbour only.</dd></dl>
<div data-widget="flow" data-config='{"scene":"ring"}'></div>
</section>

<h1 id="six-months-on-cassandra">Six Months on Cassandra</h1>
<p>A public channel on the Puzzles &amp; Dragons subreddit server takes <strong>20 seconds</strong> to load.</p>
<p>Anyone who waits sees a channel with <strong>one message</strong> in it.</p>
<p>Someone had deleted millions of messages. Cassandra marks each delete so that it reaches <strong>every replica</strong>, and each read has to scan those markers.</p>
</section>

<h1 id="early-2022">Early 2022</h1>
<p>Five years later, the Cassandra cluster has grown from 12 nodes to <strong>177</strong> and holds <strong>trillions of messages</strong>.</p>
<p>The engineers on call are paged for the database so often that the team calls it a high toil system.</p>

<h1 id="may-2022">May 2022</h1>
<p>Discord finishes moving every message to <strong>ScyllaDB</strong>, which is compatible with Cassandra and written in C++.</p>
<p>Because C++ needs <strong>no garbage collector</strong>, the database stops pausing to reclaim memory.</p>
<p>177 nodes shrank to <strong>72</strong>.</p>
<p>Hot partitions can still occur in ScyllaDB, so the data services <strong>stay in place</strong>.</p>
</section>

<h1 id="summary">Summary</h1>
<div class="sum">
<div class="pt"><b>Rate impact and likelihood separately.</b><span>At Rogers, five successful changes lowered the rating to low while the impact of a core failure stayed at its maximum.</span></div>
<div class="pt"><b>Each mitigation adds a new risk.</b><span>Cassandra removed Discord's memory limit and brought hot partitions.</span></div>
<div class="pt"><b>Ratings go out of date as a system grows.</b><span>The design that suited Discord at 12 nodes paged its engineers constantly at 177.</span></div>
</div>

// marp-kit runtime core. Finds every element with data-widget="name" and mounts the widget registered under that name.
// Every dependency on Marp CLI's bespoke template (class names, presenter view markup) lives in this file, so a Marp
// upgrade that renames them is fixed here once.
(function () {
  if (window.MarpKit) return;

  var MARP = {
    slide: '.bespoke-marp-slide',                 // each slide's <svg>
    note: '.bespoke-marp-note',                   // each slide's speaker note in the presenter view, with data-index
    active: 'bespoke-marp-active',                // class on the slide being shown
    presenterPane: 'body[data-bespoke-view=presenter] .bespoke-marp-presenter-container svg.bespoke-marp-slide.bespoke-marp-active'
  };
  var TTL = 2 * 3600 * 1000;   // synced state older than this is ignored (yesterday's lecture should not come back)
  var registry = {}, counts = {};

  // Marp turns clicks off on the slide pane of its presenter view. Switch them back on for slides that hold a widget.
  var allow = document.createElement('style');
  allow.textContent = MARP.presenterPane + ':has([data-widget]) { pointer-events: auto; user-select: auto; }' + oscCss() + noteCss();
  document.head.appendChild(allow);

  // Marp's page controls: a vertical bar against the middle of the left edge, so they never cover the bottom of a slide.
  // Solid, because Marp's translucent black turns muddy where it crosses a slide's edge and the black margin beside it.
  function oscCss() {
    var osc = ':is(body[data-bespoke-view=""],body[data-bespoke-view=next]) .bespoke-marp-parent>.bespoke-marp-osc';
    var btn = osc + '>button[data-bespoke-marp-osc]';
    return osc + '{ left: 0; right: auto; top: 50%; bottom: auto; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; box-sizing: border-box; width: 46px; padding: 8px 6px; background: #1f3b73; border-radius: 0 10px 10px 0; box-shadow: 0 2px 12px rgba(31, 59, 115, .28); transition: opacity .2s ease; }' +
      osc + '>:where(*){ margin-left: 0; margin-top: 2px; }' +
      osc + '>:where(*):where(:first-child){ margin-top: 0; }' +
      btn + '{ width: 34px; height: 34px; flex: none; background-size: 18px; background-position: center; border: 0; border-radius: 8px; opacity: 1; transition: background-color .12s ease; }' +
      btn + ':hover:not(:disabled){ background-color: rgba(255, 255, 255, .18); }' +
      btn + ':hover:active:not(:disabled){ background-color: rgba(255, 255, 255, .3); }' +
      btn + ':disabled{ opacity: .35; }' +
      btn + ':focus-visible{ outline: 2px solid #fff; outline-offset: -2px; }' +
      // the tools sit apart from the slide navigation, under a thin rule
      osc + '>button[data-bespoke-marp-osc=fullscreen]{ margin-top: 15px; box-shadow: 0 -8px 0 -7px rgba(255, 255, 255, .35); }' +
      // the page number: Marp writes "Page 11 of 27", which stays as the real text and shows as a large 11 over a small "of 27"
      osc + '>span[data-bespoke-marp-osc=page]{ min-width: 0; width: 34px; margin-top: 4px; margin-bottom: 4px; opacity: 1; font-size: 0; line-height: 1; white-space: nowrap; }' +
      osc + '>span[data-bespoke-marp-osc=page]::before{ content: attr(data-mk-page); display: block; font-size: 17px; font-weight: 700; line-height: 1.15; }' +
      osc + '>span[data-bespoke-marp-osc=page]::after{ content: "of " attr(data-mk-total); display: block; font-size: 11px; line-height: 1.2; opacity: .8; }';
  }

  // the speaker note line a widget has picked out, bright against the presenter view's dark panel
  function noteCss() {
    return '.mk-note-line { display: block; padding: 2px 6px; margin: 0 -6px; border-radius: 4px; }' +
      '.mk-note-line.mk-note-on { background: #ffe27a; color: #111; font-weight: 700; }';
  }

  // copies Marp's page text into attributes that the CSS above can show, and keeps them current
  function watchPageNumber() {
    var span = document.querySelector('.bespoke-marp-parent > .bespoke-marp-osc [data-bespoke-marp-osc=page]');
    if (!span || span.hasAttribute('data-mk-watched')) return;
    span.setAttribute('data-mk-watched', '');
    function copy() {
      var m = span.textContent.match(/(\d+)\D+(\d+)/);
      if (!m) return;
      span.setAttribute('data-mk-page', m[1]);
      span.setAttribute('data-mk-total', m[2]);
    }
    new MutationObserver(copy).observe(span, { childList: true, characterData: true, subtree: true });
    copy();
  }

  function parseConfig(root) {
    var raw = root.getAttribute('data-config');
    if (!raw) return {};
    try { return JSON.parse(raw); } catch (err) { console.error('marp-kit: bad data-config on', root, err); return {}; }
  }

  function context(root, name, index) {
    var ctx = {
      root: root,
      name: name,
      config: parseConfig(root),

      // true while the widget's slide is the one on screen (or when the page is not a Marp deck)
      slideActive: function () {
        var s = root.closest(MARP.slide);

      },

      // Enter and Space activate fn, and do not reach Marp (Space would advance the deck)

      },

      // Marp uses Space, arrows, o, f, p and Escape for navigation: keep every key press inside a text field
      isolateKeys: function (el) {

      },

      // Escape normally opens Marp's slide overview. fn runs (capture phase, before Marp) while this slide is showing;
      // return true from fn to take the key, false to let Marp have it
      onEscape: function (fn) {
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && ctx.slideActive() && fn()) { e.preventDefault(); e.stopPropagation(); }
        }, true);
      },

      // Highlights the line of this slide's speaker note that contains marker, and scrolls it into view. Notes only exist in
      // the presenter view, so elsewhere this does nothing. Returns false until the note is there, so the caller can retry.
      markNote: function (marker) {
        if (document.body.getAttribute('data-bespoke-view') !== 'presenter') return false;
        var i = Array.prototype.indexOf.call(document.querySelectorAll(MARP.slide), root.closest(MARP.slide));
        var note = document.querySelector(MARP.note + '[data-index="' + i + '"]');
        if (!note) return false;
        if (!note.hasAttribute('data-mk-lines')) {
          note.setAttribute('data-mk-lines', '');
          note.querySelectorAll('p').forEach(function (p) {
            var lines = p.textContent.split('\n');
            p.textContent = '';
            lines.forEach(function (line) {
              var span = document.createElement('span');
              span.className = 'mk-note-line';
              span.textContent = line;
              p.appendChild(span);
            });
          });
        }
        note.querySelectorAll('.mk-note-line').forEach(function (line) {
          var on = line.textContent.indexOf(marker) >= 0;
          line.classList.toggle('mk-note-on', on);
          if (on) line.scrollIntoView({ block: 'nearest' });
        });
        return true;
      },

      // Keeps the presenter window (press p) and the audience window in step through localStorage, the way Marp syncs the
      // slide number. opts.get() returns the state, opts.set(state, initial) applies it; initial is true for state found at
      // load. Returns save(), to call after every local change. The storage event only fires in the OTHER window, and set()
      // must never call save(), so the two windows cannot echo each other. With storage blocked the windows run independently.
      sync: function (opts) {

        function apply(raw, initial) {
          try {

            if (!o || typeof o.t !== 'number' || Date.now() - o.t > TTL) return;
            opts.set(o.s, !!initial);
          } catch (err) {}
        }
        window.addEventListener('storage', function (e) { if (e.key === KEY && e.newValue) apply(e.newValue, false); });

      }

  }

  function mountOne(root) {
    var name = root.getAttribute('data-widget');
    if (root.hasAttribute('data-mk-ready') || !registry[name]) return;
    root.setAttribute('data-mk-ready', '');
    var index = counts[name] = (counts[name] || 0) + 1;
    try {
      registry[name](context(root, name, index));
      // widgets show their static fallback (print, PDF, no scripts) until this class is set
      root.classList.add('mk-ready');
    } catch (err) {
      console.error('marp-kit: widget "' + name + '" failed to mount', err);
    }
  }

  window.MarpKit = {
    marp: MARP,
    // register a widget: fn(ctx) builds it inside ctx.root
    widget: function (name, fn) { registry[name] = fn; },
    mount: function () { watchPageNumber(); document.querySelectorAll('[data-widget]').forEach(mountOne); }
  };
})();

// risk-board (Lecture 10): the 3 by 3 architecture risk matrix from Richards and Ford, chapter 22, used as a board.
// Each risk is a chip. A chip starts in the tray beside the matrix, and the presenter puts it in the cell the room
// settles on with two clicks: the chip, then the cell. A click on the tray sends the selected chip back. There is no
// dragging, so the board behaves the same in every browser and in the presenter view. Boards with the same name share
// their chips, so a risk rated on one slide is still in its cell on every later slide that lists it.
//
//   ```widget risk-board
//   board: 'discord'                          the name that slides share
//   risks:                                    the chips on this slide, in tray order
//     - { id: 'mongo', label: 'Single database' }
//   rows:                                     optional register rows, listed beside the matrix
//     - [ 'mongo', 'Replication', 'disagree' ]      risk, mitigation, new risk. A risk is a chip id or plain text
//   start: { example: '3x1' }                 optional: the cell (impact x likelihood) a chip sits in until it is moved
//   ```
//
// For tests and styling: .cell[data-impact][data-likelihood] with a .num and a low, medium or high class,
// button.chip[data-id] (.selected), .tray, .hint, button.clear, .register .row
MarpKit.riskBoards = MarpKit.riskBoards || {};   // board name -> { where: { chip id: 'IxL' }, boards: [redraw functions] }

MarpKit.widget('risk-board', function (ctx) {
  var root = ctx.root, cfg = ctx.config || {};
  var name = cfg.board || 'board', risks = cfg.risks || [], rows = cfg.rows || [], begin = cfg.start || {};
  var shared = MarpKit.riskBoards[name] = MarpKit.riskBoards[name] || { where: {}, boards: [] };
  var selected = null;
  var NAMES = ['Low', 'Medium', 'High'];
  function level(p) { return p <= 2 ? 'low' : p <= 4 ? 'medium' : 'high'; }
  function el(tag, cls, text, parent) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function labelOf(id) { var r = risks.filter(function (x) { return x.id === id; })[0]; return r ? r.label : id; }
  // 'tray' records that a chip with a starting cell was sent back to the tray
  function spot(id) { var at = shared.where[id] || begin[id] || null; return at === 'tray' ? null : at; }

  // ----- the matrix
  var grid = el('div', 'grid', '', root);
  el('div', 'axis like', 'Likelihood', grid);
  el('div', 'axis imp', 'Impact', grid);
  NAMES.forEach(function (n, i) { el('div', 'col', n + ' (' + (i + 1) + ')', grid).style.gridColumn = String(i + 3); });
  var cells = {};
  NAMES.forEach(function (n, r) {
    var impact = r + 1;

    NAMES.forEach(function (m, c) {

      var cell = el('div', 'cell ' + level(product), '', grid);

      cell.dataset.likelihood = likelihood;
      cell.style.gridRow = String(r + 3);
      cell.style.gridColumn = String(c + 3);

      cell.setAttribute('tabindex', '0');
      cell.setAttribute('aria-label', 'Impact ' + impact + ', likelihood ' + likelihood + ', rating ' + product);
      el('span', 'num', String(product), cell);

      cell.addEventListener('click', drop);
      cell.addEventListener('keydown', ctx.key(drop));

    });
  });

  // ----- the side panel: register rows, then the tray of chips that have no cell yet
  var side = el('div', 'side', '', root);
  if (rows.length) {
    var reg = el('div', 'register', '', side);
    var head = el('div', 'row head', '', reg);
    ['Risk', 'Mitigation', 'New risk'].forEach(function (t) { el('span', '', t, head); });
    rows.forEach(function (r) {
      var row = el('div', 'row', '', reg);

    });
  }
  var tray = el('div', 'tray', '', side);
  var trayLabel = el('div', 'tray-label', 'Not yet rated', tray);
  var trayChips = el('div', 'chips', '', tray);
  tray.addEventListener('click', function () { if (selected) place(selected, null); });
  var clear = el('button', 'clear', 'Clear', side);
  clear.type = 'button';
  clear.addEventListener('click', function (e) {
    e.stopPropagation();
    risks.forEach(function (r) { delete shared.where[r.id]; });
    selected = null;
    changed();
  });
  var hint = el('div', 'hint', 'Click a risk, then click a cell.', side);

  // ----- the chips: a click selects one. With one selected, a click on a chip that sits in a cell puts the selected
  // chip in that same cell, since the room often rates two risks alike
  var chips = {};
  risks.forEach(function (r) {
    var chip = el('button', 'chip', r.label);
    chip.type = 'button';
    chip.dataset.id = r.id;
    chips[r.id] = chip;
    function pick() {
      var home = chip.closest('.cell');
      if (selected && selected !== r.id && home) place(selected, home.dataset.impact + 'x' + home.dataset.likelihood);
      else select(selected === r.id ? null : r.id);
    }
    chip.addEventListener('click', function (e) { e.stopPropagation(); pick(); });
    chip.addEventListener('keydown', ctx.key(pick));
  });

  function select(id) { selected = id; draw(); }
  function place(id, where) {
    shared.where[id] = where || 'tray';
    if (!where && !begin[id]) delete shared.where[id];
    selected = null;
    changed();
  }
  function changed() {
    shared.boards.forEach(function (redraw) { redraw(); });   // every slide of this board, in this window
    save();                                                   // and the other window
  }

  function draw() {
    var waiting = 0;
    risks.forEach(function (r) {
      var chip = chips[r.id], at = spot(r.id), cell = at && cells[at];
      (cell ? cell.querySelector('.chips') : trayChips).appendChild(chip);
      if (!cell) waiting++;

      chip.setAttribute('aria-pressed', selected === r.id ? 'true' : 'false');
    });
    root.classList.toggle('picking', !!selected);

    hint.textContent = selected ? 'Now click a cell, or the tray to take it back.' : 'Click a risk, then click a cell.';
  }

  shared.boards.push(draw);
  root.setAttribute('data-sync-key', 'risk-board:' + name);
  var save = ctx.sync({
    get: function () { return shared.where; },
    set: function (s) {
      var next = {};
      for (var id in (s || {})) if (/^([123]x[123]|tray)$/.test(s[id])) next[id] = s[id];
      shared.where = next;
      shared.boards.forEach(function (redraw) { redraw(); });
    }
  });
  ctx.onEscape(function () {
    if (!selected) return false;
    select(null);
    return true;
  });
  draw();
});

// c4: a static C4 diagram (people, systems, containers, databases, boundaries and labelled arrows) drawn in the diagram
// studio's C4 style, from the same data the studio saves as a preset. A preset pastes straight in as YAML:
//
//   ```widget c4
//   maxh: 420                       optional, the most pixels high it may be (default 540)
//   boundaries: [ { id, title, kind, tech, color, x, y, w, h, labelPos: top|bottom, labelAlign: left|right, highlight } ]
//   nodes: [ { id, type: person|db|app, kind, tech, title, desc, color, x, y, w, h, highlight } ]
//   connections: [ { from, to, label: 'Uses [HTTPS]', labelPos: 0.5, bidirectional } ]
//   ```
//
// The diagram is cropped to its content and scaled to the slot's width, so studio coordinates need no adjusting.
// Geometry (box placement, arrow curves, where arrows meet a shape) is the studio's own code, kept identical so a
// diagram looks the same in both; a kit test checks that against studio/diagram_playground.html.
// Text fields are HTML, as in the studio, so a title can contain <br>.
MarpKit.widget('c4', function (ctx) {
  var NS = 'http://www.w3.org/2000/svg';
  var COLORS = {
    blue: '#2b5fb3', emerald: '#3d7a24', rose: '#b22222', amber: '#e8923a',
    indigo: '#5b4bb5', violet: '#7a3db8', slate: '#5f6368'
  };
  var HIGHLIGHT = '#e6eefb', LINE = '#444444', PAD = 4;
  var cfg = ctx.config || {}, root = ctx.root;
  var nodes = cfg.nodes || [], boundaries = cfg.boundaries || [], connections = cfg.connections || [];
  var col = function (name) { return COLORS[name] || COLORS.blue; };

  // crop to the content
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.concat(boundaries).forEach(function (o) {
    minX = Math.min(minX, o.x); minY = Math.min(minY, o.y);
    maxX = Math.max(maxX, o.x + o.w); maxY = Math.max(maxY, o.y + o.h);
  });
  if (minX === Infinity) return;
  var W = maxX - minX + 2 * PAD, H = maxY - minY + 2 * PAD;

  var stage = document.createElement('div');
  stage.className = 'c4-stage';
  var canvas = document.createElement('div');
  canvas.className = 'c4-canvas';
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var inner = document.createElement('div');
  inner.className = 'c4-inner';
  inner.style.left = (PAD - minX) + 'px';
  inner.style.top = (PAD - minY) + 'px';
  stage.appendChild(canvas);
  canvas.appendChild(inner);
  root.appendChild(stage);

  var MARK = 'c4-arrow-' + Math.random().toString(36).slice(2, 8);
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'c4-lines');
  svg.innerHTML = '<defs><marker id="' + MARK + '" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="' + LINE + '"/></marker></defs>';

  // boundaries, under everything else
  boundaries.forEach(function (b) {
    var c = col(b.color), div = document.createElement('div');
    div.className = 'c4-boundary';
    place(div, b);
    div.style.borderColor = c;
    div.style.backgroundColor = b.highlight ? HIGHLIGHT : 'transparent';
    var head = document.createElement('div');
    head.className = 'c4-boundary-head';
    head.style.color = c;
    head.style[b.labelAlign === 'right' ? 'right' : 'left'] = '12px';
    if (b.labelAlign === 'right') head.style.textAlign = 'right';
    head.style[b.labelPos === 'top' ? 'top' : 'bottom'] = '8px';
    head.innerHTML = '<b>' + b.title + '</b>' + (b.kind ? '<i>[' + b.kind + (b.tech ? ': ' + b.tech : '') + ']</i>' : '');
    div.appendChild(head);
    inner.appendChild(div);
  });
  inner.appendChild(svg);

  // nodes
  nodes.forEach(function (n) {
    var c = col(n.color), fill = n.highlight ? HIGHLIGHT : '#fff', w = n.w, h = n.h;
    var div = document.createElement('div');
    div.className = 'c4-node c4-' + (n.type === 'person' || n.type === 'db' ? n.type : 'box');
    div.setAttribute('data-id', n.id);
    place(div, n);
    var tag = n.kind ? '[' + n.kind + (n.tech ? ': ' + n.tech : '') + ']' : (n.tech ? '[Container: ' + n.tech + ']' : '');
    var text = '<div class="c4-text" style="color:' + c + '"><b>' + n.title + '</b>' + (tag ? '<i>' + tag + '</i>' : '') + (n.desc ? '<p>' + n.desc + '</p>' : '') + '</div>';
    if (n.type === 'db') {
      var rx = w / 2 - 2, ry = 16, cyTop = ry + 2, yBot = h - ry - 2;
      div.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '"><path d="M 2,' + cyTop + ' L 2,' + yBot + ' A ' + rx + ',' + ry + ' 0 0,0 ' + (w - 2) + ',' + yBot + ' L ' + (w - 2) + ',' + cyTop + ' Z" fill="' + fill + '" stroke="' + c + '" stroke-width="2"/>' +
        '<ellipse cx="' + w / 2 + '" cy="' + cyTop + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '" stroke="' + c + '" stroke-width="2"/></svg>' + text;
    } else if (n.type === 'person') {
      var headR = 28, bodyTop = 40;
      div.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '"><rect x="2" y="' + bodyTop + '" width="' + (w - 4) + '" height="' + (h - bodyTop - 2) + '" rx="22" fill="#fff" stroke="' + c + '" stroke-width="2"/>' +
        '<circle cx="' + w / 2 + '" cy="' + (headR + 2) + '" r="' + headR + '" fill="#fff" stroke="' + c + '" stroke-width="2"/></svg>' +
        '<div class="c4-body" style="top:' + (headR * 2 + 6) + 'px">' + text + '</div>';

      div.style.backgroundColor = fill;

  var byId = {};

    var from = byId[conn.from], to = byId[conn.to];

    var end = borderPoint(to, from.x + from.w / 2, from.y + from.h / 2);
    var build = function (e) {
      var ex = e.x - start.x, ey = e.y - start.y;

        c2x: start.x + ex * 0.75, c2y: start.y + ey * 0.9,
        d: 'M ' + start.x + ' ' + start.y + ' C ' + (start.x + ex * 0.25) + ' ' + (start.y + ey * 0.1) + ', ' + (start.x + ex * 0.75) + ' ' + (start.y + ey * 0.9) + ', ' + e.x + ' ' + e.y
      };
    };
    var endLine = end, headLen = conn.bidirectional ? 0 : 10.8;
    if (headLen > 0 && Math.hypot(end.x - start.x, end.y - start.y) > headLen * 2) {
      for (var i = 0; i < 4; i++) {
        var b = build(endLine);
        var tx = endLine.x - b.c2x, ty = endLine.y - b.c2y, tl = Math.hypot(tx, ty) || 1;
        endLine = { x: end.x - (tx / tl) * headLen, y: end.y - (ty / tl) * headLen };
      }
    }
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'c4-rel');
    path.setAttribute('d', build(endLine).d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', LINE);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-dasharray', '7 5');
    path.setAttribute('marker-end', 'url(#' + MARK + ')');
    if (conn.bidirectional) path.setAttribute('marker-start', 'url(#' + MARK + ')');
    svg.appendChild(path);

    if (!conn.label || !String(conn.label).trim()) return;
    // plain text on a white patch, protocol on its own line
    var pos = typeof conn.labelPos === 'number' ? conn.labelPos : 0.5;
    var mx = start.x + (end.x - start.x) * pos, my = start.y + (end.y - start.y) * pos;
    var m = /^(.*?)\s*(\[[^\]]+\])\s*$/.exec(String(conn.label).trim());
    var main = m && m[1] ? m[1] : String(conn.label).trim(), proto = m && m[1] ? m[2] : '';
    var inHighlight = boundaries.some(function (bd) { return bd.highlight && mx >= bd.x && mx <= bd.x + bd.w && my >= bd.y && my <= bd.y + bd.h; });
    var label = document.createElement('div');

    label.style.left = mx + 'px';

    label.innerHTML = '<div>' + (conn.bidirectional ? '⟷ ' : '') + main + '</div>' + (proto ? '<div class="c4-proto">' + proto + '</div>' : '');
    inner.appendChild(label);
  });

  function place(div, o) {
    div.style.left = o.x + 'px';
    div.style.top = o.y + 'px';
    div.style.width = o.w + 'px';
    div.style.height = o.h + 'px';
  }

  // where the line from the shape's centre toward (tx, ty) leaves its outline. People and cylinders are drawn 1px in
  function borderPoint(n, tx, ty) {

  // as wide as the slot, at most maxh pixels high
  function fit() {
    var aw = root.clientWidth;

    var s = Math.min(aw / W, (+cfg.maxh || 540) / H);

// flow: animated diagrams that play by themselves. Each scene draws boxes, then moves labelled chips between them on
// a timeline, with a caption saying what is happening. It plays once while its slide is on screen and holds its last
// frame, restarts when the slide is entered, and holds one finished frame in print or with reduced motion. A timeline
// control (play button and draggable track) fades in after the first run and stays in step between presenter and
// audience windows. Optional pause points wait for the presenter's next key, and light up the matching "[Pause N]" or
// "[End]" bullet in the speaker notes.
//
// Scenes belong to the deck. A deck-local widgets/flow.scenes.js registers them, and can add colours:
//   MarpKit.flow.colors.teal = ['#00796b', '#e0f2f1'];          // [stroke, fill]
//   MarpKit.flow.scene('pipeline', function (d) { d.size(800, 300); d.end(6); d.box({...}); d.chip({...}); d.cap(0, '...'); });
// Markup: <div data-widget="flow" data-config='{"scene":"pipeline"}'></div>
MarpKit.flow = {
  scenes: {},
  colors: {
    prompt: ['#2b5fb3', '#e6eefb'], kv: ['#a85c10', '#fdf0e1'], out: ['#2d6a18', '#e6f3e0'], rej: ['#b22222', '#fbe6e6'],
    box: ['#3c4043', '#ffffff'], ctl: ['#6a33a8', '#f2eafa'], user: ['#2d6a18', '#ffffff'], idle: ['#c8ccd2', '#f4f5f7']
  },
  scene: function (name, fn) { MarpKit.flow.scenes[name] = fn; }
};

MarpKit.widget('flow', function (ctx) {
  var NS = 'http://www.w3.org/2000/svg';
  var COL = MarpKit.flow.colors;
  var root = ctx.root, items = [], caps = [], stops = [], still = null, end = 10;

  var svg = document.createElementNS(NS, 'svg');
  var cap = document.createElement('div');
  cap.className = 'cap';
  var ARROW = 'flow-arrow-' + Math.random().toString(36).slice(2, 8);
  svg.innerHTML = '<defs><marker id="' + ARROW + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#70757a"/></marker></defs>';
  var bg = el('g', {}, svg), fg = el('g', {}, svg);
  root.appendChild(svg);
  root.appendChild(cap);

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);

  }
  function txt(parent, x, y, text, size, color, weight) {
    var t = el('text', { x: x, y: y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': size, fill: color, 'font-weight': weight || 400 }, parent);
    t.textContent = text;

  function inRange(ranges, t) { return (ranges || []).some(function (r) { return t >= r[0] && t < r[1]; }); }

  function shown(o, t) { return !o.show || (t >= o.show[0] && t < (o.show[1] === undefined ? Infinity : o.show[1])); }

  // the small vocabulary every scene is written in
  var d = {
    colors: COL,
    size: function (w, h) { svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); },
    end: function (t) { end = t; },
    still: function (t) { still = t; },
    // times to stop and wait for the presenter. A scene with stops also holds on its last frame instead of looping
    stops: function (list) { stops = list; },
    cap: function (t, text) { caps.push([t, text]); },

    // a labelled box or cylinder. glow: [[from, to], ...] lights it up while it works
    box: function (o) {
      var c = COL[o.color || 'box'], g = el('g', {}, bg), shape, top;
      if (o.db) {
        var ry = 18, x = o.x, y = o.y, w = o.w, h = o.h;
        shape = el('path', { d: 'M' + x + ',' + (y + ry) + ' L' + x + ',' + (y + h - ry) + ' A' + w / 2 + ',' + ry + ' 0 0 0 ' + (x + w) + ',' + (y + h - ry) + ' L' + (x + w) + ',' + (y + ry) + ' Z', fill: c[1], stroke: c[0], 'stroke-width': 3 }, g);
        top = el('ellipse', { cx: x + w / 2, cy: y + ry, rx: w / 2, ry: ry, fill: c[1], stroke: c[0], 'stroke-width': 3 }, g);
      } else {
        shape = el('rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx: o.r === undefined ? 10 : o.r, fill: c[1], stroke: c[0], 'stroke-width': o.dash ? 2 : 3, 'stroke-dasharray': o.dash ? '10 7' : 'none' }, g);
      }
      if (o.dash) shape.setAttribute('fill', 'none');
      var ty = o.ty !== undefined ? o.ty : o.y + o.h / 2 - (o.sub ? 14 : 0);
      if (o.label) txt(g, o.lx !== undefined ? o.lx : o.x + o.w / 2, ty, o.label, o.size || 28, c[0], 700);
      if (o.sub) txt(g, o.x + o.w / 2, ty + 32, o.sub, o.subSize || 21, c[0]);
      items.push({ draw: function (t) {
        g.style.opacity = shown(o, t) ? 1 : 0;
        var lit = inRange(o.glow, t);
        shape.setAttribute('stroke-width', lit ? 6 : (o.dash ? 2 : 3));
        if (!o.dash) shape.setAttribute('fill', lit ? (o.hot || '#fff3c4') : c[1]);

      } });
    },

    // plain text that can appear on the timeline
    text: function (o) {
      var t = txt(bg, o.x, o.y, o.text, o.size || 24, o.color || '#444', o.weight);
      items.push({ draw: function (now) { t.style.opacity = shown(o, now) ? 1 : 0; } });
    },

    // a connector. Marked with an arrowhead unless plain is set
    line: function (o) {
      var a = { x1: o.x1, y1: o.y1, x2: o.x2, y2: o.y2, stroke: '#70757a', 'stroke-width': 3 };
      if (!o.plain) a['marker-end'] = 'url(#' + ARROW + ')';

    },

    // a bar that fills between two times, to show how long work takes
    bar: function (o) {

      el('rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx: 4, fill: '#eef0f4' }, bg);

    },

      var g = el('g', { class: 'chip' }, fg);

      el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: o.solid ? 3 : 7, fill: o.solid ? c[0] : c[1], stroke: c[0], 'stroke-width': 2.5 }, g);
      if (o.text !== '') txt(g, 0, 1, o.text, o.size || 21, o.solid ? '#fff' : c[0], 700);
      items.push({ draw: function (t) {
        var a = o.at, first = a[0][0], until = o.until === undefined ? Infinity : o.until;

      d.cap(L - 0.2, 'A log is a timestamped record of one event, written by the service where it happened.');
      d.cap(M - 0.2, 'A metric is a measurement taken over time, such as latency or requests per second.');
      d.cap(T - 0.2, 'A trace is the path of one request across the services, built from timed steps called spans.');
      d.cap(E - 0.2, 'OpenTelemetry records an exception as an event on the span where it happened.');
      d.cap(X, 'Products such as Sentry, Datadog, Grafana and Honeycomb store and query these signals.');
    },

    // observability, part 2: the same store when checkouts turn slow. The latency metric crosses its threshold and
    // raises an alert, a trace of one slow checkout puts the time in the database span, and the database log gives
    // the reason. Every number is made up for the lecture
    diagnose: function (d) {
      var M = 2.2, T = 5.4, L = 9.4;                        // when the metric, the trace and the log begin
      d.size(1140, 400); d.end(L + 3.6); d.still(L + 3.6); d.stops([5, 9]);
      storeBase(d, { db: [[T + 2.4, 99]] });

      // what the customer sees: a checkout that takes seconds, with no sign of where the time goes
      storeHop(d, 'checkout', 'kv', [[0.3, 'cust'], [1, 'api']], 1);
      d.text({ x: 230, y: 20, text: 'Waiting', size: 18, weight: 700, color: RED, show: [1, T] });
      // the metric: five normal points, then four that climb past the threshold
      d.line({ x1: 456, y1: 214, x2: 684, y2: 214, plain: true });
      d.text({ x: 500, y: 201, text: 'Threshold', size: 15, color: '#555' });
      [250, 246, 252, 248, 251].forEach(function (y, i) { storeDot(d, i, y, 'prompt', 0); });
      [238, 226, 204, 194].forEach(function (y, i) { storeDot(d, i + 5, y, 'rej', M + i * 0.3); });
      d.chip({ text: '120 ms', color: 'prompt', w: 96, h: 28, size: 16, at: [[0, 500, 288]], until: M + 0.9 });
      d.chip({ text: '3,050 ms', color: 'rej', w: 110, h: 28, size: 16, at: [[M + 0.9, 500, 288]] });
      d.text({ x: 640, y: 288, text: 'Alert sent', size: 19, weight: 700, color: RED, show: [M + 1.3] });
      // the trace: one slow checkout. Nearly all of the time is in the database span
      storeHop(d, 'checkout', 'kv', [[T, 'cust'], [T + 0.6, 'api'], [T + 1.2, 'pay'], [T + 1.8, 'db']], T + 3);
      storeSpan(d, 0, 772, 316, 'Store API 3,050 ms', 'prompt', [T + 0.6]);
      storeSpan(d, 1, 784, 304, 'Payments service 3,020 ms', 'ctl', [T + 1.2]);
      storeSpan(d, 2, 796, 292, 'Orders database 2,980 ms', 'rej', [T + 1.8]);
      // the log: what the database recorded for that request
      storeEmit(d, 'query took 2,980 ms', 'prompt', 'db', 'logs', 190, L);
      storeEmit(d, 'full scan of orders table', 'rej', 'db', 'logs', 226, L + 0.5);

      d.cap(0, 'Customers of the same store now wait several seconds for each checkout.');
      d.cap(M - 0.2, 'The latency metric climbs past its threshold, which sends an alert to the engineer on call.');
      d.cap(T - 0.2, 'A trace of one slow checkout shows the database span using 2,980 of the 3,050 milliseconds.');
      d.cap(L - 0.2, 'The database log for that request records a full table scan, which points to a missing index.');
    },

    // The Discord message store in four acts, with a pause after each of the first three.
    //   1. MongoDB working as expected: one primary takes writes and reads, so a read returns the latest message
    //   2. MongoDB past 100 million messages: memory holds 4 of 13 messages here, and a read of the rest waits on disk.
    //      Each secondary is a read only copy of everything, so it has the same limit
    //   3. Cassandra: messages spread over six nodes with no primary, and a write is copied to two other nodes
    //   4. The trade: with a node down, writes and reads still succeed on the other two replicas, and the node catches up
    //      when it returns. What is given up is any check between two writes that arrive together
    // Sizes are illustrative
    stores: function (d) {
      var C = 12.6;                                              // when Cassandra replaces MongoDB on screen
      d.size(1140, 400); d.end(C + 11.4); d.still(C + 11.4); d.stops([5, 12.2, C + 3]);
      var GREEN = '#2d6a18', M = [0, C - 0.1];                   // M: while MongoDB is on screen
      var slot = function (j) { return [470 + j * 42, 110]; };   // in memory
      var disk = function (j) { return [470 + (j % 4) * 42, 182 + Math.floor(j / 4) * 34]; };
      var copy = function (k, j) { return [840 + ((j - 1) % 6) * 36, 104 + k * 150 + Math.floor((j - 1) / 6) * 28]; };   // message j on secondary k
      var CLIENT = [185, 195], EDGE = [290, 170];

      d.box({ x: 30, y: 150, w: 150, h: 90, label: 'Client', color: 'user', size: 24 });

      // ----- acts 1 and 2: MongoDB
      d.box({ x: 290, y: 30, w: 350, h: 280, label: 'MongoDB primary', size: 22, ty: 54, show: M, glow: [[7.2, M[1]]], hot: DOWN });
      d.box({ x: 310, y: 78, w: 310, h: 64, r: 8, dash: true, show: M });
      d.text({ x: 378, y: 110, text: 'In memory', size: 18, weight: 700, color: '#555', show: M });
      d.text({ x: 378, y: 200, text: 'Disk only', size: 18, weight: 700, color: '#555', show: M });
      [0, 1].forEach(function (k) {
        d.box({ x: 760, y: 40 + k * 150, w: 300, h: 110, label: 'Secondary, read only copy', size: 19, ty: 60 + k * 150, show: M, glow: [[9.9, M[1]]], hot: DOWN });
      });
      d.line({ x1: 180, y1: 195, x2: 288, y2: 170, show: M });
      d.line({ x1: 640, y1: 95, x2: 758, y2: 95, show: M });
      d.line({ x1: 640, y1: 245, x2: 758, y2: 245, show: M });

      // act 1: a write reaches the primary and both secondaries, then a read returns it
      d.chip({ text: 'msg', color: 'prompt', w: 46, h: 26, size: 17, at: [[0.5, CLIENT[0], CLIENT[1]], [1.4, slot(0)[0], slot(0)[1]]], until: M[1] });
      [0, 1].forEach(function (k) {
        d.chip({ text: 'msg', color: 'prompt', w: 46, h: 26, size: 17, at: [[1.5, 640, 95 + k * 150], [2.3, 796, 104 + k * 150]], until: M[1] });
      });
      d.chip({ text: 'read', color: 'ctl', w: 56, h: 26, size: 17, at: [[2.9, CLIENT[0], CLIENT[1]], [3.6, EDGE[0], EDGE[1]]], until: 3.7 });
      d.chip({ text: 'msg', color: 'prompt', w: 46, h: 26, size: 17, at: [[3.7, EDGE[0], EDGE[1]], [4.4, CLIENT[0], CLIENT[1]]], until: 5.2 });
      d.text({ x: 105, y: 268, text: 'Latest message', size: 19, weight: 700, color: GREEN, show: [4.4, 5.3] });

      // act 2: twelve more messages. Three fit in memory and nine do not, and every one is copied to both secondaries
      for (var i = 0; i < 12; i++) {
        var t0 = 5.4 + i * 0.15, to = i < 3 ? slot(i + 1) : disk(i - 3);
        d.chip({ text: '', color: 'prompt', solid: true, w: 32, h: 24, at: [[t0, CLIENT[0], CLIENT[1]], [t0 + 0.9, to[0], to[1]]], until: M[1] });
        [0, 1].forEach(function (k) {
          var c = copy(k, i + 1);
          d.chip({ text: '', color: 'prompt', solid: true, w: 28, h: 20, at: [[t0 + 1, 640, 95 + k * 150], [t0 + 1.6, c[0], c[1]]], until: M[1] });
        });
      }
      d.text({ x: 533, y: 290, text: 'Not in memory', size: 19, weight: 700, color: RED, show: [7.2, M[1]] });
      d.chip({ text: 'read', color: 'ctl', w: 56, h: 26, size: 17, at: [[7.8, CLIENT[0], CLIENT[1]], [8.4, EDGE[0], EDGE[1]]], until: 8.5 });
      d.chip({ text: 'msg', color: 'rej', w: 46, h: 26, size: 17, at: [[8.5, EDGE[0], EDGE[1]], [9.6, CLIENT[0], CLIENT[1]]], until: M[1] });
      d.text({ x: 105, y: 268, text: 'Slow read', size: 19, weight: 700, color: RED, show: [8.5, M[1]] });
      d.text({ x: 910, y: 170, text: 'Same data, same memory limit', size: 19, weight: 700, color: RED, show: [9.9, M[1]] });

      // ----- acts 3 and 4: Cassandra
      var NODE = [[290, 30], [560, 30], [830, 30], [290, 220], [560, 220], [830, 220]];
      var COLOR = ['prompt', 'out', 'kv', 'ctl', 'teal', 'pink'];
      d.text({ x: 705, y: 13, text: 'Cassandra cluster', size: 20, weight: 700, color: '#111', show: [C + 0.1] });
      NODE.forEach(function (n, k) {
        d.box({ x: n[0], y: n[1], w: 250, h: 150, label: 'Node ' + (k + 1), size: 21, ty: n[1] + 24, show: [C + 0.1], glow: k === 2 ? [[C + 3.3, C + 8.2]] : [], hot: DOWN });
        for (var j = 0; j < 3; j++) {
          d.chip({ text: '', color: COLOR[k], solid: true, w: 32, h: 24, at: [[C + 0.4 + k * 0.12 + j * 0.05, n[0] + 80 + j * 45, n[1] + 62]] });
        }
      });
      var at = function (k) { return [NODE[k][0] + 125, NODE[k][1] + 108]; };   // where a node shows the value it holds
      var value = function (text, color, path, until) { d.chip({ text: text, color: color, w: 46, h: 26, size: 17, at: path, until: until }); };

      // act 3: a write to node 2 is copied to nodes 3 and 5
      value('v1', 'kv', [[C + 1.6, CLIENT[0], CLIENT[1]], [C + 2.1, at(1)[0], at(1)[1]]], C + 4.6);
      value('v1', 'kv', [[C + 2.1, at(1)[0], at(1)[1]], [C + 2.6, at(2)[0], at(2)[1]]], C + 9.2);
      value('v1', 'kv', [[C + 2.1, at(1)[0], at(1)[1]], [C + 2.6, at(4)[0], at(4)[1]]], C + 5.3);

      // act 4: node 3 is down while v2 is written. Two of the three replicas still confirm the write, a read of two
      // replicas still returns it, and node 3 receives it when it comes back
      d.text({ x: 1042, y: 54, text: 'Down', size: 20, weight: 700, color: RED, show: [C + 3.3, C + 8.2] });
      value('v2', 'out', [[C + 3.8, CLIENT[0], CLIENT[1]], [C + 4.6, at(1)[0], at(1)[1]]]);
      value('v2', 'out', [[C + 4.7, at(1)[0], at(1)[1]], [C + 5.3, at(4)[0], at(4)[1]]]);
      d.text({ x: 105, y: 268, text: 'Write accepted', size: 19, weight: 700, color: GREEN, show: [C + 4.6, C + 6.2] });
      [1, 4].forEach(function (k) {
        d.chip({ text: 'read', color: 'ctl', w: 56, h: 26, size: 17, at: [[C + 6.3, CLIENT[0], CLIENT[1]], [C + 7, at(k)[0] - 60, at(k)[1]]], until: C + 7.1 });
      });
      value('v2', 'out', [[C + 7.1, at(1)[0] - 60, at(1)[1]], [C + 7.9, CLIENT[0], CLIENT[1]]], C + 9.4);
      d.text({ x: 105, y: 268, text: 'Latest value', size: 19, weight: 700, color: GREEN, show: [C + 7.9] });
      value('v2', 'out', [[C + 8.5, at(1)[0], at(1)[1]], [C + 9.2, at(2)[0], at(2)[1]]]);

      d.cap(0, 'Every write goes to one MongoDB primary, which copies it to two secondaries.');
      d.cap(2.8, 'Because reads also go to the primary, each read returns the latest message.');
      d.cap(5.3, 'Past 100 million messages, the primary holds more than its memory can keep.');
      d.cap(7.8, 'A read that misses memory has to wait for the disk on that one primary.');
      d.cap(9.9, 'Each secondary is a full copy that takes no writes, so more secondaries add no room.');
      d.cap(C, 'Cassandra spreads the messages across many nodes, none of which is a primary.');
      d.cap(C + 1.6, 'Any node accepts a write and copies it to two other nodes.');
      d.cap(C + 3.2, 'While one node is down, 2 of the 3 replicas still confirm the write.');
      d.cap(C + 6, 'A read asks 2 replicas and keeps the newest value, so it still returns the latest write.');
      d.cap(C + 8.2, 'When the node returns, it receives the write it missed.');
      d.cap(C + 9.8, 'The cost is that two writes arriving together are merged field by field, with no check.');
    },

    // N = 3, W = 2, R = 2: a read always reaches one replica that holds the latest write
    quorum: function (d) {
      d.size(1140, 330); d.end(12.5); d.still(12.5); d.stops([5, 9.5]);
      var Y = [55, 165, 275];

      d.box({ x: 30, y: 115, w: 210, h: 100, label: 'Client', color: 'user', size: 27 });
      Y.forEach(function (y, i) {
        d.box({ x: 800, y: y - 45, w: 310, h: 90, label: 'Replica ' + (i + 1), size: 25, lx: 895 });
        d.line({ x1: 240, y1: 165, x2: 798, y2: y });
      });

      // every replica starts with the old value
      d.chip({ text: 'v1', color: 'kv', w: 70, at: [[0, 1040, Y[0]]], until: 2.6 });
      d.chip({ text: 'v1', color: 'kv', w: 70, at: [[0, 1040, Y[1]]], until: 2.6 });
      d.chip({ text: 'v1', color: 'kv', w: 70, at: [[0, 1040, Y[2]]], until: 11.6 });
      // the write reaches replicas 1 and 2, and the client stops waiting
      d.chip({ text: 'v2', color: 'out', w: 70, at: [[1, 250, 165], [2.6, 1040, Y[0]]] });
      d.chip({ text: 'v2', color: 'out', w: 70, at: [[1, 250, 165], [2.6, 1040, Y[1]]] });
      d.text({ x: 400, y: 50, text: 'W = 2', size: 28, weight: 700, color: '#2d6a18', show: [3] });
      // the read asks replicas 2 and 3 and gets one new value and one old value
      d.chip({ text: 'read', color: 'ctl', w: 78, size: 19, at: [[5.5, 250, 165], [6.6, 790, Y[1]]], until: 6.7 });
      d.chip({ text: 'read', color: 'ctl', w: 78, size: 19, at: [[5.5, 250, 165], [6.6, 790, Y[2]]], until: 6.7 });
      d.chip({ text: 'v2', color: 'out', w: 70, at: [[7, 790, Y[1]], [8.2, 300, 150]], until: 8.3 });
      d.chip({ text: 'v1', color: 'kv', w: 70, at: [[7, 790, Y[2]], [8.2, 300, 185]], until: 8.3 });
      d.chip({ text: 'v2', color: 'out', w: 70, at: [[8.3, 135, 250]] });
      d.text({ x: 400, y: 280, text: 'R = 2', size: 28, weight: 700, color: '#6a33a8', show: [7] });
      // the last replica catches up later
      d.chip({ text: 'v2', color: 'out', w: 70, at: [[10.4, 1040, Y[1]], [11.6, 1040, Y[2]]] });
      d.text({ x: 620, y: 300, text: '2 + 2 > 3', size: 34, weight: 700, color: '#1f3b73', show: [9.8] });

      d.cap(0, 'With 3 replicas for each message, N = 3.');
      d.cap(1, 'A write returns once 2 replicas confirm it, so W = 2.');
      d.cap(5.3, 'Since a read asks 2 replicas and keeps the newest value, R = 2.');
      d.cap(9.8, 'Whenever R + W > N, a read reaches at least one replica that holds the latest write.');
    },

    // hash partitioning with Discord style keys: the partition key (the channel, with no time bucket) goes through a hash
    // function, and the result modulo 3 picks one of three nodes. Channel names and hash values are illustrative
    hash: function (d) {
      d.size(1140, 400); d.end(14.6); d.still(14.6); d.stops([6]);
      var NY = [70, 200, 330], held = [0, 0, 0];

      d.box({ x: 30, y: 150, w: 200, h: 100, label: 'New message', color: 'user', size: 22 });
      d.box({ x: 400, y: 150, w: 200, h: 100, label: 'Hash function', color: 'ctl', size: 22 });
      d.line({ x1: 230, y1: 200, x2: 398, y2: 200 });
      NY.forEach(function (y, k) {
        d.box({ x: 860, y: y - 55, w: 250, h: 110, label: 'Node ' + k, size: 21, ty: y - 35 });
        d.line({ x1: 600, y1: 200, x2: 858, y2: y });
      });

      // one message: its key, the hash of the key, and the node that number selects
      var message = function (t, key, hash) {
        var node = hash % 3, row = held[node]++;
        d.chip({ text: key, color: 'prompt', w: 110, h: 28, size: 18, at: [[t, 135, 200], [t + 1.2, 500, 200]], until: t + 1.3 });
        d.chip({ text: String(hash), color: 'kv', w: 50, h: 28, size: 18, at: [[t + 1.3, 610, 200], [t + 2, 700, 200], [t + 2.7, 700, 200], [t + 3.5, 850, NY[node]]], until: t + 3.6 });
        d.text({ x: 700, y: 150, text: hash + ' mod 3 = ' + node, size: 22, weight: 700, color: '#a85c10', show: [t + 2, t + 3.6] });
        d.chip({ text: key, color: 'prompt', w: 110, h: 28, size: 18, at: [[t + 3.6, 985, NY[node] - 5 + row * 32]] });
      };
      message(0.5, 'general', 7);
      message(6.3, 'general', 7);
      message(7.9, 'gaming', 12);
      message(9.5, 'music', 5);

      d.cap(0, 'The partition key in this example is the channel of the message.');
      d.cap(1.7, 'A hash function turns the key into a number.');
      d.cap(2.5, 'The number modulo the node count selects the node, so 7 mod 3 gives node 1.');
      d.cap(6.2, 'A message with the same key always reaches the same node.');
      d.cap(7.9, 'Other keys reach other nodes, which spreads the data evenly.');
      d.cap(13.3, 'Cassandra places Discord messages by hashing too, with a ring in place of mod N.');
    },

    // two example channels on four nodes. The busy channel, world cup, is stored on nodes 1 to 3, and the quiet one,
    // music, on nodes 2 to 4. Reads of world cup overload its nodes, so a quorum read of music gets one fast reply
    // from node 4 and has to wait on a busy node for the second. Names and placement are illustrative
    hot: function (d) {
      d.size(1140, 400); d.end(13); d.still(13); d.stops([5.6, 10]);
      var X = [420, 625, 830, 1035];                      // centre of each node
      var ON = { cup: [0, 1, 2], music: [1, 2, 3] };

      d.box({ x: 30, y: 30, w: 250, h: 80, label: 'Readers of world cup', color: 'user', size: 20 });
      d.box({ x: 30, y: 290, w: 250, h: 80, label: 'One reader of music', color: 'user', size: 20 });
      X.forEach(function (x, k) {
        d.box({ x: x - 90, y: 105, w: 180, h: 190, label: 'Node ' + (k + 1), size: 21, ty: 128, glow: k < 3 ? [[3.6, 99]] : [], hot: DOWN });
      });
      // which channels each node stores
      ON.cup.forEach(function (k) { d.chip({ text: 'world cup', color: 'kv', w: 130, h: 30, size: 17, at: [[0, X[k], 168]] }); });
      ON.music.forEach(function (k) { d.chip({ text: 'music', color: 'prompt', w: 130, h: 30, size: 17, at: [[0, X[k], 206]] }); });

      // many reads of world cup pile up on nodes 1 to 3
      for (var i = 0; i < 12; i++) {
        var t0 = 1.6 + i * 0.2, k = i % 3, j = Math.floor(i / 3);
        d.chip({ text: '', color: 'rej', solid: true, w: 26, h: 20, at: [[t0, 285, 70], [t0 + 1.1, X[k] - 48 + j * 32, 262]] });
      }
      d.text({ x: 625, y: 84, text: 'Busy with world cup reads', size: 20, weight: 700, color: RED, show: [3.8] });

      // one quorum read of music asks nodes 2, 3 and 4 and needs two replies
      ON.music.forEach(function (k) {
        d.chip({ text: 'read', color: 'prompt', w: 66, h: 26, size: 17, at: [[6.2, 285, 330], [7.3, X[k], 322]], until: k === 3 ? 7.5 : (k === 1 ? 10.7 : 99) });
      });
      d.chip({ text: 'reply', color: 'out', w: 70, h: 26, size: 17, at: [[7.5, X[3], 322], [8.4, 290, 345]] });
      d.text({ x: 155, y: 388, text: '1 of 2 replies', size: 19, weight: 700, color: RED, show: [8.4, 11.9] });
      d.chip({ text: 'reply', color: 'out', w: 70, h: 26, size: 17, at: [[10.8, X[1], 322], [11.9, 290, 316]] });
      d.text({ x: 155, y: 388, text: 'Slow read', size: 19, weight: 700, color: RED, show: [11.9] });

      d.cap(0, 'Cassandra stores each channel on 3 of these 4 nodes.');
      d.cap(1.6, 'When many users read world cup at once, nodes 1, 2 and 3 fall behind.');
      d.cap(6, 'A quorum read of music asks nodes 2, 3 and 4 and needs 2 replies.');
      d.cap(7.5, 'Node 4 replies at once, while nodes 2 and 3 are still serving world cup.');
      d.cap(10.6, 'The second reply arrives late, so a quiet channel becomes slow.');
    },

    // request coalescing: four users open the same channel at once. Without a data service the API sends four
    // identical queries. With one, the service sends a single query and answers all four from its result
    coalesce: function (d) {
      var C = 5;                                           // when the data service appears
      d.size(1140, 370); d.end(C + 7.4); d.still(C + 7.4); d.stops([4.6]);
      var Y = [110, 160, 210, 260];

      d.box({ x: 30, y: 85, w: 160, h: 200, label: 'Users', color: 'user', size: 24, ty: 60 });
      d.box({ x: 270, y: 85, w: 170, h: 200, label: 'API', size: 24, ty: 60 });
      d.box({ x: 540, y: 85, w: 200, h: 200, label: 'Data service', color: 'ctl', size: 22, ty: 60, show: [C + 0.1] });
      d.box({ x: 860, y: 85, w: 250, h: 200, label: 'Database', size: 24, db: true, ty: 320, glow: [[2.6, C]], hot: DOWN });
      d.line({ x1: 190, y1: 185, x2: 268, y2: 185 });
      d.line({ x1: 440, y1: 185, x2: 858, y2: 185, show: [0, C] });
      d.line({ x1: 440, y1: 185, x2: 538, y2: 185, show: [C + 0.1] });
      d.line({ x1: 740, y1: 185, x2: 858, y2: 185, show: [C + 0.1] });

      var req = function (path, until) { d.chip({ text: 'world cup', color: 'kv', w: 120, h: 28, size: 17, at: path, until: until }); };
      var reply = function (path, until) { d.chip({ text: 'messages', color: 'out', w: 112, h: 28, size: 17, at: path, until: until }); };
      // before: four requests, four queries
      Y.forEach(function (y, i) {
        var t = 0.4 + i * 0.15;
        req([[t, 110, y], [t + 0.9, 355, y], [t + 1.3, 355, y], [t + 2.3, 985, y]], C);
      });
      d.text({ x: 650, y: 150, text: '4 queries', size: 24, weight: 700, color: RED, show: [2.8, C] });
      // after: the same four requests reach the data service, which asks once and answers four times
      Y.forEach(function (y, i) {
        var t = C + 0.6 + i * 0.15;
        req([[t, 110, y], [t + 0.9, 355, y], [t + 1.2, 355, y], [t + 2.1, 640, y]], C + 3.3);
        reply([[C + 5.3, 640, y], [C + 6.4, 110, y]]);
      });
      req([[C + 3.3, 740, 185], [C + 4, 985, 185]], C + 4.3);
      d.text({ x: 800, y: 150, text: '1 query', size: 24, weight: 700, color: '#2d6a18', show: [C + 3.3] });
      reply([[C + 4.4, 985, 185], [C + 5.2, 640, 185]], C + 5.3);

      d.cap(0, 'Four users open the world cup channel at the same moment.');
      d.cap(1.6, 'Without coalescing, the API sends 4 identical queries to the database.');
      d.cap(C + 0.2, 'Discord adds data services between the API and the database.');
      d.cap(C + 3.2, 'A data service sends one query for identical requests that arrive together.');
      d.cap(C + 5.3, 'All four users receive the result of that one query.');
    },

    // hash mod N when a node is added: six channels on three nodes, then on four. Four of the six change node.
    // The hash values are illustrative
    grow: function (d) {
      var C = 3.4;                                          // when the fourth node appears
      d.size(1140, 380); d.end(C + 5.6); d.still(C + 5.6); d.stops([3]);
      var X = [150, 400, 650, 900], Y = [150, 200];
      var CH = [['gaming', 12], ['memes', 9], ['general', 7], ['art', 4], ['music', 5], ['world cup', 14]];
      [0, 1, 2, 3].forEach(function (n) {
        d.box({ x: X[n] - 105, y: 70, w: 210, h: 190, label: 'Node ' + n, size: 22, ty: 96, show: n < 3 ? [0] : [C] });
      });
      d.text({ x: 525, y: 30, text: 'node = hash mod 3', size: 26, weight: 700, color: '#1f3b73', show: [0, C] });
      d.text({ x: 525, y: 30, text: 'node = hash mod 4', size: 26, weight: 700, color: '#1f3b73', show: [C] });
      var slot3 = {}, slot4 = {}, moved = 0;
      CH.forEach(function (c, i) {
        var a = c[1] % 3, b = c[1] % 4;
        var from = [X[a], Y[slot3[a] = (slot3[a] === undefined ? 0 : slot3[a] + 1)]];
        var label = c[0] + ' (' + c[1] + ')', w = label.length * 10 + 26, t = 0.3 + i * 0.2;
        if (a === b) {
          d.chip({ text: label, color: 'prompt', w: w, h: 30, size: 17, at: [[t, 525, 30], [t + 1, from[0], from[1]]] });
          slot4[b] = (slot4[b] === undefined ? 0 : slot4[b] + 1);
          return;
        }
        var go = C + 1.4 + moved++ * 0.25;
        d.chip({ text: label, color: 'prompt', w: w, h: 30, size: 17, at: [[t, 525, 30], [t + 1, from[0], from[1]]], until: go });
        // channels that stay keep the upper slots, so a moved channel lands under them
        var to = [X[b], Y[b === 0 ? 1 : (slot4['m' + b] = (slot4['m' + b] === undefined ? (b === 3 ? 0 : (b === 1 ? 0 : 1)) : slot4['m' + b] + 1))]];
        d.chip({ text: label, color: 'rej', w: w, h: 30, size: 17, at: [[go, from[0], from[1]], [go + 1.2, to[0], to[1]]] });
      });
      d.text({ x: 525, y: 300, text: '4 of 6 channels moved', size: 24, weight: 700, color: RED, show: [C + 3.4] });

      d.cap(0, 'Six channels sit on 3 nodes, each on node number hash mod 3.');
      d.cap(C, 'A fourth node changes the rule to hash mod 4.');
      d.cap(C + 1.4, 'Four of the six channels now map to a different node.');
      d.cap(C + 3.6, 'Each move means copying a channel between nodes under live traffic.');
    },

    // consistent hashing: three nodes and six channels on a ring. Each channel belongs to the next node clockwise.
    // A fourth node joins and takes one channel. Positions are illustrative
    ring: function (d) {
      d.size(1140, 400); d.end(10.6); d.still(10.6); d.stops([4.8]);
      drawRing(d);
      ringNode(d, 0, 30); ringNode(d, 1, 150); ringNode(d, 2, 270);
      ringNode(d, 3, 215, 5.8);
      [['art', 10, 0], ['world cup', 60, 1], ['general', 105, 1], ['music', 245, 2], ['memes', 310, 0]].forEach(function (c, i) {
        ringChannel(d, c[0], c[1], c[2], 0.3 + i * 0.2, undefined, true);
      });
      ringChannel(d, 'gaming', 190, 2, 1.3, 7.2, true);
      ringChannel(d, 'gaming', 190, 3, 7.2);
      // a lookup: from the channel, clockwise to the next node
      var path = [60, 80, 100, 120, 140, 150].map(function (a, i) { var p = onRing(a, RING.r + 22); return [2.2 + i * 0.3, p[0], p[1]]; });
      d.chip({ text: '', color: 'rej', solid: true, w: 18, h: 18, at: path, until: 4.2 });

      var line = function (y, text, color, show) { d.text({ x: 850, y: y, text: text, size: 23, weight: 700, color: color, show: show }); };
      line(110, 'Node 0 holds art and memes', '#2b5fb3', [3.8]);
      line(160, 'Node 1 holds world cup and general', '#2d6a18', [3.8]);
      line(210, 'Node 2 holds gaming and music', '#a85c10', [3.8, 7.2]);
      line(210, 'Node 2 holds music', '#a85c10', [7.2]);
      line(260, 'Node 3 holds gaming', '#6a33a8', [7.2]);
      line(320, '1 of 6 channels moved', RED, [7.6]);

      d.cap(0, 'A hash places each node and each channel at a point on a ring.');
      d.cap(2.2, 'A channel belongs to the next node clockwise, so world cup belongs to Node 1.');
      d.cap(5.4, 'A fourth node joins the ring between Node 1 and Node 2.');
      d.cap(7.2, 'Only gaming changes owner, because Node 3 is now its next node clockwise.');
      d.cap(9, 'One channel moves here, compared with four under mod N.');
    },

    // virtual nodes: with one point each, Node 0 owns four of the six channels and Node 1 owns none. With three points
    // each, every node owns two channels. Positions are illustrative
    vnodes: function (d) {
      d.size(1140, 400); d.end(11); d.still(11); d.stops([4.8]);
      drawRing(d);
      ringNode(d, 0, 20); ringNode(d, 1, 60); ringNode(d, 2, 220);
      [[0, 140], [0, 260], [1, 180], [1, 300], [2, 100], [2, 340]].forEach(function (p, i) { ringNode(d, p[0], p[1], 5.6 + i * 0.2); });
      // channel, angle, owner with one point each, owner with three points each
      [['art', 10, 0, 0], ['world cup', 80, 2, 2], ['general', 160, 2, 1], ['gaming', 240, 0, 0], ['music', 280, 0, 1], ['memes', 315, 0, 2]].forEach(function (c, i) {
        if (c[2] === c[3]) { ringChannel(d, c[0], c[1], c[2], 0.3 + i * 0.35, undefined, true); return; }
        ringChannel(d, c[0], c[1], c[2], 0.3 + i * 0.35, 7.4, true);
        ringChannel(d, c[0], c[1], c[3], 7.4);
      });

      var line = function (y, text, color, show) { d.text({ x: 850, y: y, text: text, size: 23, weight: 700, color: color, show: show }); };
      line(130, 'Node 0 holds 4 channels', '#2b5fb3', [3.2, 7.4]);
      line(180, 'Node 1 holds none', '#2d6a18', [3.2, 7.4]);
      line(230, 'Node 2 holds 2 channels', '#a85c10', [3.2, 7.4]);
      line(130, 'Node 0 holds 2 channels', '#2b5fb3', [7.4]);
      line(180, 'Node 1 holds 2 channels', '#2d6a18', [7.4]);
      line(230, 'Node 2 holds 2 channels', '#a85c10', [7.4]);

      d.cap(0, 'With one point each, the nodes split the ring unevenly.');
      d.cap(3.2, 'Node 0 owns 4 of the 6 channels, while Node 1 owns none.');
      d.cap(5.4, 'Virtual nodes give each node several points around the ring.');
      d.cap(7.4, 'Each node now owns 2 channels.');
      d.cap(9.2, 'The technique comes from Amazon Dynamo and is also used by Cassandra.');
    }
  };

  for (var name in SCENES) MarpKit.flow.scene(name, SCENES[name]);
})();

MarpKit.mount();
</script></body></html>
